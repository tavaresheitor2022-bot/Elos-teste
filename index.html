<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070C18" />
<title>Elos · Lixo Aqui</title>
<style>
:root{
  --paper:#070C18; --surface:#111C33; --surface-2:#0B1224; --ink:#EAF1FD; --slate:#8394B7;
  --line:#22314F; --blue:#2E7BFF; --blue-2:#175FE6; --blue-soft:#132644;
  --leaf:#34D6A0; --leaf-soft:#0E2E29; --amber:#F6B23C; --amber-soft:#332711;
  --rust:#FB5D66; --rust-soft:#37161F; --sky:#43B9F5; --sky-soft:#0E2A3D;
  --violet:#A78BFA; --violet-soft:#221B3C;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.5);
  --glow:0 8px 26px rgba(46,123,255,.35);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--paper)}
.elos{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);min-height:100%;line-height:1.45;
  background:radial-gradient(1100px 560px at 50% -8%,#12244A 0%,transparent 60%),
    radial-gradient(900px 480px at 100% 0,#101F3D 0%,transparent 55%),var(--paper);
  background-color:var(--paper);
  font-feature-settings:"cv02","cv03","cv04";-webkit-font-smoothing:antialiased}
.elos button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(11,18,36,.85);color:var(--ink);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.04em;
  color:#7C93C4;text-transform:uppercase}
.seg{display:flex;background:#0A1120;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#8AA0C8;font-weight:700;
  font-size:13px;padding:8px 13px;border-radius:999px;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 0 18px rgba(46,123,255,.55)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
.h2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:0}
.muted{color:var(--slate)}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue)}
.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:800;font-size:15px;
  background:var(--blue);color:#fff;transition:.15s;width:100%;box-shadow:var(--glow)}
.btn:hover{background:var(--blue-2)}
.btn:disabled{background:#26324F;color:#6C7EA3;box-shadow:none;cursor:not-allowed}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn-ghost:hover{background:#182643;border-color:var(--blue)}
.link{color:var(--blue);font-weight:700;text-decoration:none;font-size:13px}
.link:hover{text-decoration:underline}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 13px;font-size:13px;font-weight:600;color:var(--slate);transition:.12s}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 14px rgba(46,123,255,.4)}
.chip.on-leaf{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 14px rgba(46,123,255,.4)}

/* citizen column */
.col{max-width:460px;margin:20px auto 0}
.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.step .n{flex:0 0 24px;height:24px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;
  color:var(--slate);background:#0C1730;transition:.15s;font-weight:600}
.drop:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#0D1830}
.field::placeholder{color:#5E6E92}
.field:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea.field{resize:vertical;min-height:64px}

/* dashboard */
.grid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.stat{flex:1;min-width:96px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:11px 13px;text-align:left;transition:.12s;box-shadow:var(--shadow)}
.stat.on{outline:2px solid var(--blue);outline-offset:-1px}
.stat .num{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .lbl{font-size:12px;font-weight:600;color:var(--slate)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;gap:12px;padding:12px;cursor:pointer;transition:.12s}
.rcard:hover{border-color:var(--blue)}
.rthumb{flex:0 0 74px;width:74px;height:74px;border-radius:10px;object-fit:cover;
  border:1px solid var(--line)}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:.01em}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.04em}

/* SLA meter */
.meter{height:7px;border-radius:999px;background:#1A2643;overflow:hidden}
.meter > span{display:block;height:100%;border-radius:999px}

/* map */
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0A1120}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,7,16,.74);z-index:40;display:flex;
  align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(3px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;border:1px solid var(--line);box-shadow:0 -12px 44px rgba(0,0,0,.55)}
@media(min-width:640px){.scrim{align-items:center;padding:24px}
  .sheet{border-radius:18px}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:#0E1A33;border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:12px 16px;font-size:13px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 22px rgba(46,123,255,.2);max-width:420px;
  display:flex;gap:10px;align-items:center}

@media(max-width:820px){.grid{grid-template-columns:1fr}}

</style>
</head>

<div id="root"></div>
